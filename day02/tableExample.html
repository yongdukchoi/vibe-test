<!DOCTYPE html>
<html lang="en"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
         /*
        선택자 란  css 를 부여하는 대상
        div(태그 명) : 페이지에서 해당 태그 전체에 적용
        #id : id 가 적용된 tag 에 영향
        .class명 : 해당 클래스 명을 가진 태그에 적용
        */
        .blue {
            background-color: blue;
        }
        .pink {
            background-color: pink;
        }
        .ivory {
            background-color: ivory;
        }
</style>        
        
             
</head>
<body>
    <div class="blue">1</div>    
    <div class="pink">2</div>    
    <div class="ivory">3</div>    
     <div class="ivory">4</div>   
    <div>5</div>    
    <div>6</div>    
</body>
</html>
